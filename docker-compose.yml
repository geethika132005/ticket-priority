version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticket_backend_api
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      - ./tickets.db:/app/tickets.db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticket_streamlit_ui
    command: ["python", "-m", "streamlit", "run", "frontend.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:5000
    depends_on:
      - backend
